name: CI (Pull Requests)

# Prueft jeden Pull Request vor dem Merge. Deployt nichts - das macht deploy-mittwald.yml
# nach dem Merge auf main (dort laufen dieselben Pruefungen noch einmal).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit-Tests
        run: npm test

  openapi:
    name: OpenAPI-Pfadliste aktuell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # Der Generator braucht nur Node selbst - kein npm ci noetig.
      - name: openapi.paths.ts mit den Routen abgleichen
        run: npm run openapi:check
